name: platform

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  networks:
    - microservice-network
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-common-env: &common-env
  TZ: ${TZ:-Europe/Istanbul}

x-vault-env: &vault-env
  VAULT_URI: ${VAULT_URI:-http://vault:8200}
  VAULT_SCHEME: ${VAULT_SCHEME:-http}
  VAULT_TOKEN: ${VAULT_TOKEN}
  VAULT_FAIL_FAST: ${VAULT_FAIL_FAST:-true}

services:
  # Faz 18.5-18.7 — discovery-server RETIRED
  # Reason: K8s Deployment authoritative (platform-prod ns). Edge routing K8s NodePort only.
  # Note: user direktif Faz 19 migration scope'a dahil (kaynak kod + Eureka config new app-source repo).
  # Refs: platform-k8s-gitops PR #107 + Faz 18.5-18.7 evidence doc.

  postgres-db:
    <<: *runtime-defaults
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      <<: *common-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-users}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./devops/postgres:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Faz 18.5-18.7 — openfga-migrate + openfga RETIRED
  # Reason: K8s StatefulSet openfga + migrate Job authoritative (platform-prod ns). Store/model Vault'tan ESO ile.
  # Refs: platform-k8s-gitops PR #107 + Faz 18.5-18.7 evidence doc + Codex 019dc07c parity gate PASS.

  # Faz 18.5-18.7 — 9 stateless app services RETIRED
  # Blocks: permission-service, auth-service, user-service, variant-service, core-data-service,
  #         api-gateway, report-service, schema-service (+ already-retired openfga-migrate, openfga, discovery-server).
  # Reason: K8s Deployment authoritative (platform-prod + platform-test ns). Edge routing K8s NodePort only.
  #   ai.acik.com → 127.0.0.1:30443 (K8s prod), testai.acik.com → K8s test (31080/5545)
  # Live evidence: 2026-04-24 17:27-17:30 UTC stop+rm (11 container total, zero regression)
  #   K8s 19 prod + 10 test Running stable; edge 200; /api/ 401 JWT flow; /realms/ 200 KC stateful kaldı
  #   OpenFGA parity (Codex gate): /api/v1/authz/version 401 "JWT token zorunludur" = K8s auth chain + store alive
  # Codex AGREE: thread 019dc07c (ready_for_impl=true, 2 gate PASS)
  # Refs: platform-k8s-gitops PR #107 + Faz 18.5-18.7 evidence doc + ADR-0002 D6 stateful tier.
  # User direktif absorb: "düzgün çalışan sistemleri bozma" + "bekleme yok hızlı güvenli" (no-soak).

  # ── Infrastructure: Keycloak ────────────────────────────────
  keycloak:
    <<: *runtime-defaults
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.5.5}
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    environment:
      <<: *common-env
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD must be set in env file}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_HOSTNAME:-https://ai.acik.com}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # PostgreSQL backend (H2 data loss prevention)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak_user}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD must be set}
      KC_HEALTH_ENABLED: "true"
    depends_on:
      postgres-db:
        condition: service_healthy
    volumes:
      - ./backend/keycloak/exports:/opt/keycloak/data/import:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Infrastructure: Vault (prod mode — Raft storage, persistent) ──
  vault:
    <<: *runtime-defaults
    image: hashicorp/vault:${VAULT_VERSION:-1.21.4}
    cap_add:
      - IPC_LOCK
    # Vault merges every .hcl file in the -config directory. Base vault.hcl
    # stays unchanged; the active seal file is mounted alongside it via
    # VAULT_SEAL_FILE (P1.10). Default `vault-seal-disabled.hcl` is a no-op
    # placeholder → Shamir seal (staging keeps its vault-unseal sidecar loop).
    # Prod auto-unseal: set VAULT_SEAL_FILE env to one of
    #   ./devops/vault/vault-seal-awskms.hcl
    #   ./devops/vault/vault-seal-gcpckms.hcl
    #   ./devops/vault/vault-seal-azurekeyvault.hcl
    #   ./devops/vault/vault-seal-transit.hcl
    # plus the provider-specific env vars (see RB-vault.md). Set VAULT_SEAL_MODE
    # to a non-shamir value in the backend deploy env so deploy-backend.sh
    # skips the unseal sidecar.
    command: vault server -config=/vault/config/
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"
    environment:
      <<: *common-env
      VAULT_ADDR: "http://127.0.0.1:8200"
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - ./devops/vault/vault.hcl:/vault/config/vault.hcl:ro
      - ${VAULT_SEAL_FILE:-./devops/vault/vault-seal-disabled.hcl}:/vault/config/active-seal.hcl:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ── Infrastructure: Vault auto-unseal ──────────────────────
  vault-unseal:
    <<: *runtime-defaults
    image: hashicorp/vault:${VAULT_VERSION:-1.21.4}
    depends_on:
      vault:
        condition: service_started
    volumes:
      - ${VAULT_UNSEAL_KEYS_DIR:-/home/halil/platform/state/vault}:/vault-keys:ro
      - ./devops/vault/prod-unseal-loop.sh:/scripts/prod-unseal-loop.sh:ro
    environment:
      VAULT_ADDR: "http://vault:8200"
      SKIP_CHOWN: "true"
    entrypoint: ["/bin/sh", "/scripts/prod-unseal-loop.sh"]
    mem_limit: 64m

  # ── Infrastructure: Vault audit log init — RETIRED (Faz 18.4) ───
  # Reason: sidecar zombie (sleep infinity 2026-04-23+) — host cron authoritative Apr 20'den beri.
  # Replacement: platform-k8s-gitops/bootstrap/vault-audit-init-cron.sh (multi-vault idempotent ensure).
  # Staging-sw crontab: 15 2 * * *. Runbook: docs/RB-vault-ops-host-cron.md.
  # Refs: platform-k8s-gitops PR #104+#105, Codex thread 019dc04d AGREE.

  # ── Infrastructure: Vault Raft snapshot — RETIRED (Faz 18.4) ────
  # Reason: sidecar zombie (sleep infinity 2026-04-23+) — host cron authoritative Apr 20'den beri.
  # Replacement: platform-k8s-gitops/bootstrap/vault-snapshot-cron.sh (multi-vault + flock + unique temp).
  # Staging-sw crontab: 0 2 * * *. 4 gün live evidence Apr 21-24 OK prod/test.
  # Refs: platform-k8s-gitops PR #104+#105.

  # ── Infrastructure: Service Manager API — RETIRED (Faz 18.3 PR-B) ───
  # Reason: Docker socket cross-realm control plane, /api/services/ 410 Gone.
  # Replacement: MFE admin/services statik Ops Links (platform-ssot PR #550).
  # Refs: platform-k8s-gitops PR #100/101 tombstone, ADR D34 independence.

  # ── Infrastructure: Nginx (frontend) ───────────────────────
  # Config generated at startup via envsubst from template.
  # Docker service names (keycloak, api-gateway) are injected — never 127.0.0.1.
  web-nginx:
    <<: *runtime-defaults
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-ai.acik.com}
      NGINX_GATEWAY_UPSTREAM: ${NGINX_GATEWAY_UPSTREAM:-http://api-gateway:8080}
      NGINX_KEYCLOAK_UPSTREAM: ${NGINX_KEYCLOAK_UPSTREAM:-http://keycloak:8080}
      # NGINX_SERVICE_MANAGER_UPSTREAM removed — Faz 18.3 PR-B (service-manager retired, /api/services/ 410 Gone)
    volumes:
      - ${WEB_CURRENT_LINK:-/home/halil/platform/web/current}:/usr/share/nginx/html:ro
      - ../deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${NGINX_TLS_CERT_PATH:-/dev/null}:/etc/nginx/tls/tls.crt:ro
      - ${NGINX_TLS_KEY_PATH:-/dev/null}:/etc/nginx/tls/tls.key:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/nginx-healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ── Observability — RETIRED (Faz 18.9) ───────────────────────
  # loki + promtail + tempo + prometheus + grafana RETIRED.
  # K8s kube-prometheus-stack authoritative (8d uptime monitoring ns):
  #   grafana + prometheus + alertmanager + loki + promtail + node-exporter +
  #   state-metrics + blackbox-exporter + tempo (ClusterIP 4317/4318 OTLP).
  # Live kanıt: compose prometheus tüm target'ları DOWN (Faz 18.5-18.7 sonrası); grafana compose
  # zanzibar-authz.json dashboard K8s'te authz-plane-dashboard.yaml canonical replacement mevcut.
  # Live stop+rm 2026-04-24 17:54 UTC zero regression (edge 200, K8s 11 monitoring Running).
  # Refs: platform-k8s-gitops PR #108 + Faz 18.9 evidence; Codex thread 019dc09c GO.

networks:
  microservice-network:
    driver: bridge

volumes:
  # SSOT canonical volume definitions (must match backend/docker-compose.yml).
  # 2026-04-14: staging↔prod volume name drift (vault-data vs vault_data, etc.)
  # caused repeated fresh-volume incidents when deploy-backend.sh switched
  # between composes. Explicit `name:` pins Docker-level volume name regardless
  # of compose project name or file origin. See doctor-infra.sh Section K and
  # RB-compose-volume-ssot.md for drift guard + migration.
  postgres_data:
    name: platform_postgres_data
  vault_data:
    name: platform_vault_data
  vault_logs:
    name: platform_vault_logs
  # Faz 18.4 — vault_snapshots volume removed with vault-snapshot sidecar retirement
  # Replacement: host path /home/halil/platform/backup/vault/{prod,test}/
  # Faz 18.9 — loki_data + tempo_data volumes removed with observability retirement
  # Replacement: K8s monitoring ns loki StatefulSet + tempo Deployment (kube-prometheus-stack)
