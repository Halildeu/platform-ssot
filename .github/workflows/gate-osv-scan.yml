name: Dependency Scan (OSV)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest

      - name: Scan web dependencies
        run: osv-scanner --lockfile=web/pnpm-lock.yaml
        continue-on-error: true

      - name: Scan backend dependencies
        run: osv-scanner --lockfile=backend/pom.xml
        continue-on-error: true
