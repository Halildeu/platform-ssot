name: frontend-image

# 2026-04-20: ADR-0002 Faz B kapanış — Frontend MFE Docker image GHCR push
# K8s testai/ai için pod image. Mevcut deploy-web.yml host nginx volume mount
# pattern'i compose için kalır; bu workflow K8s deployment için image üretir.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_NAME: platform-ssot-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve owner + tag
        id: meta
        run: |
          owner_lower="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA:0:7}"
          echo "owner=${owner_lower}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner_lower}/${IMAGE_NAME}:sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push (sha + main-stable)
        uses: docker/build-push-action@v6
        with:
          context: ./web       # web/ altında apps+packages+design-tokens var
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:main-stable
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
          provenance: false

      - name: Summary
        run: |
          echo "## Frontend MFE GHCR push" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag (moving): \`main-stable\` (D30 dikkat — K8s overlay sha pin önerilir)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**K8s overlay bump (platform-k8s-gitops repo):**" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          echo "  - name: frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "    newName: ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "    newTag: ${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
