name: deploy-backend

# Faz 18 retirement migration (Codex thread 019df4ed iter-10):
# - Compose-based build path retired (services removed from backend/docker-compose.yml).
# - Per-service Dockerfile + docker/build-push-action@v5 (Maven build → JRE runtime).
# - Image namespace migrated to platform-backend-* (gitops kustomize/overlays/{test,prod}
#   tracks ghcr.io/halildeu/platform-backend-${svc}@sha256:<digest>; iter-11 verification).
# - SSH host deploy lane removed (compose retirement makes host deploy meaningless;
#   ArgoCD/k8s authoritative).
# - Matrix scope: report-service only this PR; other services V2 (Codex iter-10 scope).
#
# Pipeline downstream:
# 1. push to main matching backend/** → workflow trigger
# 2. Maven build (multi-module: common-auth + report-service)
# 3. Buildx build + GHCR push (sha-<7> tag + latest)
# 4. Digest output → manual gitops PR (V2 = repository_dispatch automation)
# 5. ArgoCD sync → platform-{test,prod} cluster

on:
  push:
    branches: [main]
    paths:
      - "backend/report-service/**"
      - "backend/common-auth/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Deployment environment (informational; gitops authoritative)"
        required: true
        default: "test"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - report-service
          # V2: auth-service, permission-service, schema-service, user-service,
          # variant-service, core-data-service, api-gateway. Bu PR sadece
          # report-service (muavin v3 critical path); diğerleri ayrı sprint.
    env:
      DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED }}

    steps:
      - name: Skip if deploy disabled
        if: ${{ env.DEPLOY_ENABLED != 'true' }}
        run: echo "::notice title=deploy-backend::DEPLOY_ENABLED!=true; skipping ${{ matrix.service }}."

      - name: Checkout
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven build (${{ matrix.service }})
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Multi-module build: common-auth dependency önce install edilir,
          # sonra service module package'lanır. Dockerfile aynı sırayı uygular
          # (multi-stage build kendi içinde mvn çağırıyor) — bu adım fast-fail
          # için pre-validate; CI'da test+jar üretimini doğrular.
          cd backend
          mvn -B -f common-auth/pom.xml clean install -DskipTests
          mvn -B -f ${{ matrix.service }}/pom.xml clean package -DskipTests

      - name: Login to GHCR
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ghcr_owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA:0:7}"
          image_base="ghcr.io/${ghcr_owner}/platform-backend-${{ matrix.service }}"
          {
            echo "image_base=${image_base}"
            echo "short_sha=${short_sha}"
            echo "tag_sha=${image_base}:sha-${short_sha}"
            echo "tag_latest=${image_base}:latest"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice title=deploy-backend::Building ${image_base}:sha-${short_sha}"

      - name: Build and push image (${{ matrix.service }})
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        id: build
        uses: docker/build-push-action@v5
        with:
          # Build context = backend/ (Dockerfile multi-module: common-auth + service)
          context: backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      - name: Output digest
        if: ${{ env.DEPLOY_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          image_pin="${{ steps.meta.outputs.image_base }}@${digest}"
          echo "::notice title=Image Pin (gitops digest)::${image_pin}"
          # GitHub step summary — runs sonrasi UI'da görünür
          {
            echo "## ${{ matrix.service }} build PASS"
            echo ""
            echo "- Tag: \`${{ steps.meta.outputs.tag_sha }}\`"
            echo "- Digest pin: \`${image_pin}\`"
            echo ""
            echo "Manual gitops bump (until V2 automation):"
            echo "\`\`\`yaml"
            echo "- name: ${{ matrix.service }}"
            echo "  newName: ${{ steps.meta.outputs.image_base }}"
            echo "  digest: ${digest}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"
