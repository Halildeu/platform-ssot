name: module-delivery-lanes
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  module-delivery-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Validate lane config + workflow contract
        run: |
          python3 ci/check_module_delivery_lanes.py --strict

      - name: Feature execution bridge gate
        env:
          # ADR-0014: org-level variable controls active lane env.
          # Pre-prod default; cutover (D30) sets DELIVERY_LANE_ENV=prod.
          DELIVERY_LANE_ENV: ${{ vars.DELIVERY_LANE_ENV || 'pre-prod' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_PARENT="$(git rev-parse HEAD^1)"
            PR_HEAD_PARENT="$(git rev-parse HEAD^2)"
            MERGE_BASE="$(git merge-base "${BASE_PARENT}" "${PR_HEAD_PARENT}")"
            python3 extensions/PRJ-PM-SUITE/contract/check_feature_execution_contract.py \
              --repo-root . \
              --base "${MERGE_BASE}" \
              --head "${PR_HEAD_PARENT}" \
              --env "${DELIVERY_LANE_ENV}" \
              --out .cache/reports/feature_execution_contract_module_delivery.v1.json
          else
            python3 extensions/PRJ-PM-SUITE/contract/check_feature_execution_contract.py \
              --repo-root . \
              --base "HEAD~1" \
              --head "HEAD" \
              --env "${DELIVERY_LANE_ENV}" \
              --out .cache/reports/feature_execution_contract_module_delivery.v1.json
          fi

      - name: Delivery session packet build
        run: |
          python3 extensions/PRJ-PM-SUITE/contract/build_delivery_session_packet.py \
            --repo-root . \
            --out .cache/reports/delivery_session_packet_module_delivery.v1.json

      - name: Delivery session guard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_PARENT="$(git rev-parse HEAD^1)"
            PR_HEAD_PARENT="$(git rev-parse HEAD^2)"
            MERGE_BASE="$(git merge-base "${BASE_PARENT}" "${PR_HEAD_PARENT}")"
            python3 extensions/PRJ-PM-SUITE/contract/check_delivery_session_guard.py \
              --repo-root . \
              --packet .cache/reports/delivery_session_packet_module_delivery.v1.json \
              --base "${MERGE_BASE}" \
              --head "${PR_HEAD_PARENT}" \
              --out .cache/reports/delivery_session_guard_module_delivery.v1.json
          else
            python3 extensions/PRJ-PM-SUITE/contract/check_delivery_session_guard.py \
              --repo-root . \
              --packet .cache/reports/delivery_session_packet_module_delivery.v1.json \
              --base "HEAD~1" \
              --head "HEAD" \
              --out .cache/reports/delivery_session_guard_module_delivery.v1.json
          fi

      - name: UX catalog gate precheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_PARENT="$(git rev-parse HEAD^1)"
            PR_HEAD_PARENT="$(git rev-parse HEAD^2)"
            MERGE_BASE="$(git merge-base "${BASE_PARENT}" "${PR_HEAD_PARENT}")"
            python3 extensions/PRJ-UX-NORTH-STAR/contract/check_ux_catalog_enforcement.py \
              --repo-root . \
              --base "${MERGE_BASE}" \
              --head "${PR_HEAD_PARENT}" \
              --out .cache/reports/ux_catalog_enforcement_module_delivery.v1.json
          else
            python3 extensions/PRJ-UX-NORTH-STAR/contract/check_ux_catalog_enforcement.py \
              --repo-root . \
              --base "HEAD~1" \
              --head "HEAD" \
              --out .cache/reports/ux_catalog_enforcement_module_delivery.v1.json
          fi

  module-lane-unit:
    runs-on: ubuntu-latest
    needs: [module-delivery-contract-check]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Run unit lane
        run: |
          python3 ci/run_module_delivery_lane.py --lane unit

  module-lane-database:
    runs-on: ubuntu-latest
    needs: [module-lane-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Run database lane
        run: |
          python3 ci/run_module_delivery_lane.py --lane database

  module-lane-api:
    runs-on: ubuntu-latest
    # ADR-0014: paralel scoreboard. Database fail/skip pre-prod gate'i
    # bloklamasın diye api lane'i sadece unit'e bağlı.
    needs: [module-lane-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Run api lane
        run: |
          python3 ci/run_module_delivery_lane.py --lane api

  module-lane-contract:
    runs-on: ubuntu-latest
    # ADR-0014: pre-prod required lane; database/api fail/skip durumundan
    # bağımsız olarak çalışmalı. Sadece unit'e bağlı.
    needs: [module-lane-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Run contract lane
        run: |
          python3 ci/run_module_delivery_lane.py --lane contract

  module-lane-integration:
    runs-on: ubuntu-latest
    # ADR-0014: integration prod-only required; tüm pre-cursor lanes
    # (database + api + contract) tamamlandıktan sonra koşar.
    needs: [module-lane-database, module-lane-api, module-lane-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Run integration lane
        run: |
          python3 ci/run_module_delivery_lane.py --lane integration

  module-lane-e2e:
    runs-on: ubuntu-latest
    needs: [module-lane-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt bulunamadi; lane baseline mode ile devam."
          fi
      - name: Run e2e lane
        run: |
          python3 ci/run_module_delivery_lane.py --lane e2e

  module-delivery-gate:
    runs-on: ubuntu-latest
    needs:
      - module-lane-unit
      - module-lane-database
      - module-lane-api
      - module-lane-contract
      - module-lane-integration
      - module-lane-e2e
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Gate check (env-aware per ADR-0014)
        env:
          # ADR-0014: org-level variable; pre-prod = unit + contract; prod = full set.
          DELIVERY_LANE_ENV: ${{ vars.DELIVERY_LANE_ENV || 'pre-prod' }}
          UNIT_RESULT: ${{ needs.module-lane-unit.result }}
          DATABASE_RESULT: ${{ needs.module-lane-database.result }}
          API_RESULT: ${{ needs.module-lane-api.result }}
          CONTRACT_RESULT: ${{ needs.module-lane-contract.result }}
          INTEGRATION_RESULT: ${{ needs.module-lane-integration.result }}
          E2E_RESULT: ${{ needs.module-lane-e2e.result }}
        run: |
          set -euo pipefail

          declare -A LANE_RESULT=(
            [unit]="$UNIT_RESULT"
            [database]="$DATABASE_RESULT"
            [api]="$API_RESULT"
            [contract]="$CONTRACT_RESULT"
            [integration]="$INTEGRATION_RESULT"
            [e2e]="$E2E_RESULT"
          )

          # Read effective required lanes from baseline (env-aware).
          REQUIRED_LANES=$(python3 - <<PY
import json, os, sys
baseline = json.loads(open("registry/technical_baseline.aistd.v1.json").read())
ci = baseline.get("ci_contract", {})
env = os.environ.get("DELIVERY_LANE_ENV", "pre-prod")
by_env = ci.get("required_lanes_by_env") or {}
lanes = by_env.get(env) or ci.get("required_lanes") or []
print(",".join(lanes))
PY
)

          echo "DELIVERY_LANE_ENV=${DELIVERY_LANE_ENV}"
          echo "REQUIRED_LANES=${REQUIRED_LANES}"
          for k in "${!LANE_RESULT[@]}"; do
            echo "${k}=${LANE_RESULT[$k]}"
          done

          if [ -z "$REQUIRED_LANES" ]; then
            echo "::error title=ADR-0014::no required_lanes resolved for env=${DELIVERY_LANE_ENV}"
            exit 1
          fi

          IFS=',' read -ra REQ <<< "$REQUIRED_LANES"
          fails=0
          for lane in "${REQ[@]}"; do
            result="${LANE_RESULT[$lane]:-missing}"
            if [ "$result" != "success" ]; then
              echo "::error title=lane ${lane}::required for env=${DELIVERY_LANE_ENV}, got '${result}'"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then
            exit 1
          fi
          echo "::notice title=module-delivery-gate::all required lanes (${REQUIRED_LANES}) green for env=${DELIVERY_LANE_ENV}"
